aid: strata-oncology
name: Strata Oncology
description: 'Strata Oncology is a precision oncology company founded in 2015 by Dan Rhodes and Scott Tomlins
  and headquartered in Ann Arbor, Michigan. It develops and runs predictive biomarker tests out of its own
  high-throughput CLIA laboratory, including StrataNGS tumor genomic profiling, the Immunotherapy Response
  Score for anti-PD-1/PD-L1 monotherapy benefit, PD-L1 IHC testing, and Antibody-Drug Conjugate Treatment
  Response Scores. Testing is delivered to health systems through the Strata Precision Oncology Network,
  with ordering and results handled through the login-gated Strata Request Portal and the Strata Assistant
  app distributed in the Epic App Orchard. Strata Oncology publishes no public developer program or API
  documentation; the only anonymous machine-readable surface API Evangelist could verify is the WordPress
  REST content API behind strataoncology.com.'
