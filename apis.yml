apis:
- aid: strata-oncology-content-api
  name: Strata Oncology Website Content API
  description: 'The public, anonymous, read-only content API behind strataoncology.com. It is the standard
    WordPress REST API (wp/v2 namespace) exposing the company''s publications, resources, team profiles,
    testimonials, pages, posts, media and taxonomies, plus two custom endpoints in an "api" namespace that the
    site theme calls to render the News & Publications and Resources pages. This is the marketing website''s
    content API, not a clinical, laboratory or ordering API - Strata Oncology publishes no public clinical API.'
