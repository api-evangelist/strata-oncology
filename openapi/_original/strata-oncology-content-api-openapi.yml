        description: Current page of the collection.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        description: Maximum number of items to be returned in result set.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Limit results to those matching a string.
      - name: subtype
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - post
            - page
            - publications
            - resources
            - team
            - category
            - post_tag
            - publication_type
            - resource_type
            - any
          default: any
        description: Limit results to items of one or more object subtypes.
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - post
          - term
          - post-format
          default: post
        description: Limit results to items of an object type.
      responses:
        '200':
          description: The search response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/Error'
  /api/publications:
    get:
      operationId: themePublications
      summary: Theme endpoint powering the News & Publications page
      description: 'Theme endpoint powering the News & Publications page: paged sections of press releases and publications.
        Takes no query parameters; paging is expressed inside the response sections.'
      tags:
      - Publications
      parameters: []
      responses:
        '200':
          description: A sectioned, paged content payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeSectionsResponse'
        '404':
          $ref: '#/components/responses/Error'
  /api/resources:
    get:
      operationId: themeResources
      summary: Theme endpoint powering the Resources page
      description: 'Theme endpoint powering the Resources page: paged sections of product information and patient resources.
        Takes no query parameters; paging is expressed inside the response sections.'
      tags:
      - Resources
      parameters: []
      responses:
        '200':
          description: A sectioned, paged content payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeSectionsResponse'
        '404':
          $ref: '#/components/responses/Error'
components:
  schemas:
    ContentItem:
      type: object
      description: A WordPress REST content object. Fields observed on live anonymous responses.
      properties:
        id:
          type: integer
          description: Unique identifier.
        date:
          type: string
          description: Publication date in the site's timezone.
        date_gmt:
          type: string
          description: Publication date as GMT.
        modified:
          type: string
          description: Last modification date in the site's timezone.
        modified_gmt:
          type: string
          description: Last modification date as GMT.
        slug:
          type: string
          description: Alphanumeric identifier unique to its type.
        status:
          type: string
          description: Named status.
        type:
          type: string
          description: Content type name.
        link:
          type: string
          format: uri
          description: Public URL of the item.
        guid:
          type: object
          description: Globally unique identifier.
          properties:
            rendered:
              type: string
        title:
          type: object
          description: Item title.
          properties:
            rendered:
              type: string
        content:
          type: object
          description: Item content.
          properties:
            rendered:
              type: string
            protected:
              type: boolean
        excerpt:
          type: object
          description: Item excerpt.
          properties:
            rendered:
              type: string
            protected:
              type: boolean
        featured_media:
          type: integer
          description: Featured media item id.
        _links:
          type: object
          description: HAL-style hypermedia links to related resources.
      required:
      - id
      - slug
      - type
      - link
    SearchResult:
      type: object
      description: A search hit.
      properties:
        id:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
        type:
          type: string
        subtype:
          type: string
        _links:
          type: object
    ThemeSectionsResponse:
      type: object
      description: Envelope returned by the custom `api` namespace endpoints.
      properties:
        success:
          type: boolean
          description: Whether the request succeeded.
        data:
          type: object
          properties:
            layout:
              type: string
              description: Layout key used by the theme.
            sections:
              type: array
              description: Content sections, each independently paged.
              items:
                $ref: '#/components/schemas/ThemeSection'
    ThemeSection:
      type: object
      description: One paged content section.
      properties:
        name:
          type: string
          description: Section display name.
        btnText:
          type: string
          description: Call-to-action label.
        btnParam:
          type: string
          description: Slug the CTA filters on.
        currentPage:
          type: integer
          description: Current page number.
        totalPosts:
          type: integer
          description: Total items in the section.
        totalPages:
          type: integer
          description: Total pages in the section.
        postsPerPage:
          type: integer
          description: Items returned per page.
        posts:
          type: array
          description: Items on this page.
          items:
            type: object
            properties:
              title:
                type: string
              content:
                type: string
              permalink:
                type: string
                format: uri
    Error:
      type: object
      description: WordPress REST error envelope, as observed live.
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. rest_no_route.
        message:
          type: string
          description: Human-readable message.
        data:
          type: object
          description: Error detail.
          properties:
            status:
              type: integer
              description: HTTP status code.
      required:
      - code
      - message
  responses:
    Error:
      description: Error response using the WordPress REST error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_no_route
            message: No route was found matching the URL and request method.
            data:
              status: 404
